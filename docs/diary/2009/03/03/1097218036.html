<div class="content">
<p>
 今ふとみたらこんな表示になってた。
</p>
<p>
 <a href="フォト id:photo_343909767" target="_blank">
  <img alt="フォト id:photo_343909767" src="photo_343909767.jpg"/>
 </a>
</p>
<p>
 マズイ、いなくなったかと思われる…ｗ
（って誰に？）
生きてます。
</p>
<p>
 はや三月。
</p>
<p>
 今月はちょっとは外に出られるかなあ。
月末には某爆音ドラマーに連れられて出没する予定らしい？
</p>
<p>
 演奏はしないんだけど。
</p>
<p>
 いやしかし、演奏していないと毎日つまらないですな。
</p>
<p>
 忙しいのに退屈です。
</p>
