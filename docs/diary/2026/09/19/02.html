<div class="qs" data-label="第二章 反米から「親米・反共」へ">
 <p>
  終戦直後、石原が目指した「小さな満州」建設には、
武田、曹をはじめ全国から「東亜連盟」の理想に共鳴する者たちが参加した。
開墾作業には町井久之や大山倍達、さらには戦前、大逆罪に問われたアナーキストの朴烈も参加している。
開墾地は地域の名称をとって「西山農場」と名付けられた。
