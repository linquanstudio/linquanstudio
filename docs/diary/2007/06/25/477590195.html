<p>
 今夜は半分はご褒美の缶詰だｗ
</p>
<p>
 前に新たに二軒のインド料理屋を見つけてしまったけど、やはり気になるのでそのうちの一軒に。帰り道ふと見ると、こんどは「バングラデシュ家庭料理」なる店が。
</p>
<p>
 どうなってるんだ板橋？
食い切れん！！
</p>
<p>
 しかし、すちゃらか社会人の面目躍如だな。
</p>
<p>
 次の仕事はもっと近場だから、こんなことできまいなあ。
