<div class="subtitle">mixi日記から転載 id=380502629</div>
</div>

<div class="content">
<p>
 どうも昔からなのだが歩くのが下手らしい。
</p>
<p>
 足首が固いからだといわれたこともあるのだが、革靴はいて歩くと向こう脛の筋肉がものすごく疲れて、そのうちつりそうになる。
</p>
<p>
 それを気にして歩いているとそのうちふくらはぎもつりそうになるというのが大体の順序。
</p>
<p>
 向こう脛の筋肉を鍛える方法ってあるのかな？
</p>
