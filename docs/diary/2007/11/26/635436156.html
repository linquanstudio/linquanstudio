<div class="content">
<p>
 今日の夢は関西修学旅行の夢だった。
別になんてことはないのだが、なかで一つ思いついたことがあった。
修学旅行なんてつまらん、けど、行く場所でセッションやってる店を探して、当日にあわせて楽器を送っておけば、セッションして帰れるじゃん！
</p>
<p>
 完璧だ～、学生服だけど。
</p>
<p>
 という夢でした。
すでに実行できる立場ではないので、誰かやってみてください。
</p>
