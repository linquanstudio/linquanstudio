<div class="content">
<p>
 今冬初風邪。
喉に来ていて、まったく集中できません。
まったく。
そろそろ直っていい時期な気がするのになあ。
</p>
<p>
 声を出せないので、また元の木阿弥に戻ってしまわないか心配である。
</p>
<p>
 ま、でもしょうがないか。
</p>
