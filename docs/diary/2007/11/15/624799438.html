<div class="subtitle">mixi日記から転載 id=624799438</div>
</div>

<div class="content">
<p>
 ネットサーフで歌の練習のページのどっかを読んでいたら「一週間に一日はまったく歌わず声帯を休める日を作りましょう」と書いてあった。
</p>
<p>
 そんな日を作らなくちゃいけないほどガンバりゃ、そりゃ良くなるかもな。
と、皮肉に読んでいたのだが…。
</p>
<p>
 必要みたいです。
今日は休喉日。
</p>
<p>
 つーか、風邪の気配だったりして。
</p>
