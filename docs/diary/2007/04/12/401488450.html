 奥さんが銀器を磨くのにはハミガキペーストがよいよ、というのを聞いて、マッピを磨くのにハミガキペーストを使っています。
</p>
<p>
 ほんとに綺麗になるんだよなあ。使用前／使用後。
</p>
<p>
 これで毎日歯を磨いてると思うと、ほんとに磨かれてるんだろうなあとちょっと心配…、その割には綺麗になってないのはもともと歯の質が綺麗な色じゃないのと、磨き方が大雑把のとあるのでしょうが。
</p>
