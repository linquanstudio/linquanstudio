<div class="subtitle">mixi日記から転載 id=658302019</div>
</div>

<div class="content">
<p>
 パンクも乗り越え、最近は頻度が減ったけどすっかりチャリにも慣れたぞ。
</p>
<p>
 せっかちなもんで、慣れるともっと速く走りたくなるな。
</p>
<p>
 上り坂とかは今のギアでだいたい乗り切れるから、もっと高速のギアがついてて、平地を普通に走ってるときでももっと負荷がかかるのが欲しくなってくる。
</p>
<p>
 今のが６×３＝18段変速だから、６×４＝27段変速装備ならいいかな？
</p>
<p>
 何気に内転筋を鍛えて老化防止じゃ。
</p>
