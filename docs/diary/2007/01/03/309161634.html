<h1><a href="https://linquanstudio.github.io/linquanstudio/diary/2007/01/03/309161634.html" target="_blank">じかんがなーい</a></h1>
<div class="subtitle">mixi日記から転載 id=309161634</div>
</div>

<div class="content">
<p>
 年始の確認作業として楽器の基礎練習にかかる時間を調べました。ベースはほぼ45分。喇叭は唇のほぐれ具合にもよるけど、最低30分は必要か。ギターは基礎練と呼べるほどちゃんとしたメニューができているわけではないので測れなかったけど、おそらく、ベースと同等かそれ以上は必要だろうなあ。
</p>
<p>
 それ以外に曲を覚えたり基礎じゃない練習をするわけで…。
</p>
<p>
 なんだ、時間ないじゃん！！
</p>
