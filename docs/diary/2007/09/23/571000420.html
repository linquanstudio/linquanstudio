<div class="content">
<p>
 本日のライブ無事終了致しました。前回にもまして色々こかした気もしますがご勘弁のほどを…(^_^;)次回のライブ予定はまだ未定ですが、早急に予定を組んで、よりお客様に楽しんでいただけるよう、練習に励みたいと思いますのでよろしくお願いいたします。見に来てくださったお客様、共演バンド、主催スタッフの皆さん、楽しい時間をありがとうございました。ではまた次回、近いうちに！
