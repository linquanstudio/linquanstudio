 思い出した＾＾
</p>
<p>
 実はここ数ヶ月右手のアクションが悪くなって出音が×で悩んでいたんだけど、バンドの練習も終わりに近づいた頃ふと弾き方を変えてみたらよくなった！
</p>
<p>
 あ、そうか、こうやって弾いてたんだっけ！？
</p>
<p>
 帰ってまた忘れちゃうと困ると思って練習しましたよ。
</p>
<p>
 24時間なにかと息苦しい日々が続いてるここ数ヶ月なのですが、こういうところから少し風が吹いてこないかなあ。
</p>
