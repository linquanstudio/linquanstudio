<h1><a href="https://linquanstudio.github.io/linquanstudio/diary/2008/09/09/928083486.html" target="_blank">夏バテ調整中の気配</a></h1>
<div class="subtitle">mixi日記から転載 id=928083486</div>
</div>

<div class="content">
<p>
 公園の木々をぬって
真っ黒いアゲハが行く
夏の終わりを告げるごと
音もなくはばたく
</p>
<p>
 終わってみれば夏は
静かに短く過ぎたものだ
が、それなりに
時は刻まれた、とも
</p>
<p>
 一瞬
すべてに距離を置いた場所で
</p>
<p>
 まだ来ない冬は
越すのに
長くかかりそうだという予感
</p>
<p>
 これから何を準備し
蓄えておこうか
</p>
