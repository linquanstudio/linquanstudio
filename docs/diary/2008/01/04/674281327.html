<div class="content">
<p>
 今日は夜から上野のセッションへ。
</p>
<p>
 「寝てた」というと、「寝るの好きですよね～」。
</p>
<p>
 そうなんだ、俺は寝るのが好きなのだ。
可能ならまだまだ寝られるぞい。
</p>
<p>
 というわけで寝ます。
おやすみなさい。
