<h1><a href="https://linquanstudio.github.io/linquanstudio/diary/2008/02/07/707277590.html" target="_blank">(もう)昨日の雪</a></h1>
<div class="subtitle">mixi日記から転載 id=707277590</div>
</div>

<div class="content">
<p>
 昨日は朝から出張で前橋に行っていた。
</p>
<p>
 行き…
</p>
<p>
 常磐道 雪
外環 雨
関越 曇
</p>
<p>
 前橋 晴れw
なんかあったかいような感じさえした
</p>
<p>
 山懐のおだやかな空気と水、みたいな。
</p>
<p>
 で、復り…
</p>
<p>
 関越 徐々に雪ぱらぱら
外環 たまにぱらぱら雨？雪まじり？
常磐 盛大に雪
</p>
<p>
 ぐえ
</p>
<p>
 まあ積もらないだろうけど。
</p>
<p>
 今はやんでいるようですな。
</p>
