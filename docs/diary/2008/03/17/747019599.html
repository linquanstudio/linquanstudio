<div class="subtitle">mixi日記から転載 id=747019599</div>
</div>

<div class="content">
<p>
 土砂降りの中徹夜で宴会をした夢をみた。
その中で思いついたクイズ「ウソかホントか？」シリーズその１。
</p>
<p>
 「サルガッソー海と猿蟹合戦は同じものである、ウソかホントか？」
答えはもちろんウソですが。
</p>
<p>
 もう一つ思いついたんだけど起きたら忘れてました。
</p>
<p>
 あけがた近くになって雨がやんだ頃家路に着きました。
ふー。
</p>
