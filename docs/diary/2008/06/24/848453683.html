 なせいか、ここに来るのはろくでもない用事の時ばかり。盛岡も前橋も甲府も静岡も、その県に住んでたらきっと嫌いになっちゃうんだろうな。一つだけほっとするのが某高校がいまだにセーラー服だってことか。駅を出ると自然に体が右を向くのは正面が役所だらけだからってだけでもあるまい。しかしその右側もつい150年前は役所なんだけどねwそういえば埼玉の県庁所在地ってどこだっけ？
