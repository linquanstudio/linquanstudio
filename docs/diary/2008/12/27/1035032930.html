<p>
 <a href="フォト id:photo_343898093" target="_blank">

<p>
 休みに入ったがペースを崩すのが嫌で、なんかで体を動かそうと、久しぶりに壁打ちへ。
忘れていた回転運動を思い出すのに１時間かな？
</p>
<p>
 めちゃめちゃ寒かったし風もあったし髪の毛がうるさかったし爽快感は二割減だが、やらないよりはいいかな。
</p>
<p>
 んー、来年はテニスしたいなあ。
</p>
<p>
 リラックスできる仲間が見つかればいいんだけどなあ。
</p>
