<div class="content">
<p>
 トシのせいか最近すっかり早起きさんになった。
</p>
<p>
 用事や必要がなくても６時台に起きる。一般的に早起きと言える時間かどうかはともかく、僕としたらかつてないことなのは変わりない。
</p>
<p>
 天気予報は晴れ、予想最高気温30℃。
</p>
<p>
 今朝は腎臓が冷えてた模様。
</p>
<p>
 うーん…。
</p>
<p>
 われながら気持ち悪いぞｗ
小学校でさえ遅刻してたのに。
</p>
