<div class="content">
<p>
 <a href="771644995_19s.jpg" target="_blank">
  <img alt="771644995_19s.jpg" src="771644995_19s.jpg"/>
 </a>
 代々木原宿間の信号故障のためとな。JRも災難だけど僕もなんか間が悪いのが続く。昨日は出かけようと思ったらまた自転車のタイヤパンクしてるし。ん？待てよ？そのおかげでいつもは停らない京浜東北線が西日暮里に停るから田端で乗り換えなくてよくなってる！うーん何が良くなるか分からんな。なんてこと打ってるうちに山手線も動くみたいだね。しかしなにかこういう小さいトラブル多くないですか。
</p>
