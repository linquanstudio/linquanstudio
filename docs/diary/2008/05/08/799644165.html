<div class="content">
<p>
 今(01:02くらい？)地震があったけど、茨城県を沖で深さ20km、M6.3と。
</p>
<p>
 夕方６時頃か、やっぱり若干揺れてて、まだ余震で思い出したように少し揺れてる。
</p>
<p>
 地震情報はまだ更新されてなくて、多分近いと思われる場所の00:25深さ17km、M4.5のが表示されてるのみ。
</p>
<p>
 なんかまだありそうかな？
</p>
<p>
 また、を、を、また結構揺れだした…。
</p>
